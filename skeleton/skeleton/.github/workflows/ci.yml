name: CI
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: echo "All tests passed"
  owasp-dependency-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      administration: write
    steps:
      - uses: actions/checkout@v4
      - name: Set repo name
        id: repo
        run: {% raw %}echo "name=$(basename $GITHUB_REPOSITORY)" >> $GITHUB_OUTPUT{% endraw %}
      - name: Enable GitHub Pages
        run: |
          {% raw %}curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}'{% endraw %}
        continue-on-error: true
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: {% raw %}${{ steps.repo.outputs.name }}{% endraw %}
          path: '.'
          format: 'HTML'
          out: 'reports'
      - name: Upload OWASP Report (artifact backup)
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: reports/
      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: {% raw %}github.ref == 'refs/heads/main'{% endraw %}
        with:
          github_token: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}
          publish_dir: ./reports
          destination_dir: owasp
